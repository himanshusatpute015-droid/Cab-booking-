<section class="card actions success">
    <h2>Ride completed 🎉</h2>
    <p>You rated this ride <span class="stars">{{stars}}</span></p>
    <p>Paid <strong>₹{{paid}}</strong> via {{payment}} <span class="muted">(fee ₹{{fee}})</span></p>
    <p class="muted small">Transaction ID: <code>{{txn}}</code></p>
    <a class="btn btn-primary btn-block" href="/">Book another ride</a>
</section>
