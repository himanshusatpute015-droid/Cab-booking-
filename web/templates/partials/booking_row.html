<tr>
    <td><a class="link" href="/booking?id={{id}}">#{{id}}</a></td>
    <td>{{customer}}</td>
    <td>{{pickup}} &rarr; {{drop}}</td>
    <td>{{icon}} {{type}}</td>
    <td>{{driver}}</td>
    <td>₹{{total}}</td>
    <td><span class="badge {{status_class}}">{{status}}</span></td>
    <td class="muted">{{created}}</td>
</tr>
