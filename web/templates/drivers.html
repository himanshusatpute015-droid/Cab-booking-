<div class="page-head">
    <div>
        <h1>Drivers</h1>
        <p class="muted">{{count}} registered driver(s)</p>
    </div>
</div>

<div class="card table-card">
    <table class="table">
        <thead>
            <tr>
                <th>ID</th><th>Driver</th><th>Phone</th><th>Vehicle</th><th>Location</th>
                <th>Rating</th><th>Rides</th><th>Earnings</th><th>Status</th><th></th>
            </tr>
        </thead>
        <tbody>
            {{{rows}}}
        </tbody>
    </table>
</div>

<section class="card form-card">
    <h2>Register a new driver</h2>
    <form method="POST" action="/drivers/add" class="form-grid">
        <label class="field"><span>Full name</span><input name="name" required maxlength="40"></label>
        <label class="field"><span>Phone number</span><input name="phone" required maxlength="10"></label>
        <label class="field"><span>Driving licence no.</span><input name="license" required maxlength="20"></label>
        <label class="field"><span>Vehicle type</span><select name="type">{{{type_options}}}</select></label>
        <label class="field"><span>Vehicle model</span><input name="model" required maxlength="30" placeholder="e.g. Honda City"></label>
        <label class="field"><span>Registration no.</span><input name="reg" required maxlength="12" placeholder="MH12AB1234"></label>
        <label class="field"><span>Current location</span><select name="location">{{{location_options}}}</select></label>
        <div class="field field-submit"><button class="btn btn-primary btn-block" type="submit">Add driver</button></div>
    </form>
</section>
